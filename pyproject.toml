[project]
name = "tmi-tf"
version = "0.1.0"
description = "Terraform infrastructure analysis tool for TMI threat models"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "python-dotenv>=1.2.2",
    "gitpython>=3.1.57",
    "requests>=2.31.0",
    "PyGithub>=2.1.1",
    # TMI client dependencies
    "certifi>=2024.2.2",
    "six>=1.16.0",
    "python-dateutil>=2.9.0",
    "setuptools>=83.0.0",
    "urllib3>=2.7.0",
    "google-auth>=2.45.0",
    "litellm>=1.83.10",
    "nh3>=0.3.3",
    "oci>=2.168.2",
]

[project.scripts]
tmi-tf = "tmi_tf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.1.0",
    "pyright>=1.1.407",
]

[tool.uv]
# oci declares cryptography<50.0.0, but it only uses cryptography for RSA signing
# and does not touch the interfaces that changed in 50.0.0. Override the cap so
# cryptography can reach 50.0.0, which fixes PYSEC-2026-3552 (PKCS#7 EnvelopedData
# Bleichenbacher oracle). Revisit once oci relaxes its own bound.
override-dependencies = ["cryptography>=50.0.0"]

[tool.ruff.lint]
# Ruff 0.16 widened its implicit default rule set (pyupgrade, isort, bandit,
# blind-except, ...). This project had no ruff config and so silently rode the
# pre-0.16 default; pin that same set explicitly so lint results no longer move
# when ruff changes its defaults.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Ruff 0.16 began formatting Python code blocks embedded in Markdown. These docs
# are prose, not formatter-managed source, so keep the formatter on Python only.
exclude = ["*.md"]

[tool.pyright]
# tmi_client is added to sys.path at runtime from ~/Projects/tmi-clients/
# and cannot be resolved statically; imports are suppressed per-line
